# Managed by zima-astro-blog. Included only inside this project's server block.
root /var/www/zima-astro-blog/current;
index index.html;
charset utf-8;
access_log /var/log/nginx/zima-astro-blog.access.log;
error_log /var/log/nginx/zima-astro-blog.error.log;
add_header X-Content-Type-Options nosniff always;
add_header Cache-Control "no-cache";

location / {
    try_files $uri $uri/index.html =404;
}

# Retain hashed assets so pages opened before a release keep working.
location ^~ /_astro/ {
    alias /var/www/zima-astro-blog/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /docs { return 301 /blog; }
location = /docs/ { return 301 /blog; }
location = /docs/rss.xml { return 301 /rss.xml; }

error_page 404 /404.html;
location = /404.html { internal; }
location ~ /\. { deny all; }
