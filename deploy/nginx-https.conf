# Managed by zima-astro-blog.
server {
    listen 80;
    listen [::]:80;
    server_name aboutme.zimagent.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zima-astro-blog/acme;
        try_files $uri =404;
    }
    location / { return 301 https://aboutme.zimagent.top$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aboutme.zimagent.top;
    ssl_certificate /etc/letsencrypt/live/aboutme.zimagent.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aboutme.zimagent.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/zima-astro-blog.conf;
}
