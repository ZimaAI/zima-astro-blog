name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zima-astro-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://aboutme.zimagent.top
    env:
      SITE_URL: https://aboutme.zimagent.top
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check and build
        run: npm run build
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if test -z "$DEPLOY_SSH_KEY"; then
            echo '::error::DEPLOY_SSH_KEY is empty. Add the private key as a repository or production environment secret.'
            exit 1
          fi
          if ! test -s deploy/known_hosts; then
            echo '::error::The pinned deploy/known_hosts file is missing from the checkout.'
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/aboutme_deploy
          install -m 600 deploy/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/aboutme_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host aboutme-production
            HostName aboutme.zimagent.top
            User aboutme-deploy
            Port 22
            IdentityFile ~/.ssh/aboutme_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF
      - name: Check deployment connection
        run: |
          if ! timeout 15 bash -c 'exec 3<>/dev/tcp/aboutme.zimagent.top/22'; then
            echo '::error::GitHub runner cannot reach aboutme.zimagent.top:22. Check DNS, firewall and port forwarding.'
            exit 1
          fi
          if ! ssh_error=$(ssh aboutme-production 'test -w /var/www/zima-astro-blog' 2>&1); then
            case "$ssh_error" in
              *'Host key verification failed'*|*'REMOTE HOST IDENTIFICATION HAS CHANGED'*)
                reason='Host key verification failed. Check deploy/known_hosts against the server host key and verify DNS/port forwarding.' ;;
              *'Permission denied (publickey)'*)
                reason='SSH public key authentication failed. Update DEPLOY_SSH_KEY from the matching private key file.' ;;
              '')
                reason='SSH login succeeded but the deployment directory is not writable by aboutme-deploy.' ;;
              *)
                reason='SSH connection failed after TCP handshake. Inspect the Check deployment connection step log.'
                printf '%s\n' "$ssh_error" >&2 ;;
            esac
            echo "::error::$reason"
            exit 1
          fi
      - name: Upload and activate release
        env:
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          destination="/var/www/zima-astro-blog/releases/$RELEASE_ID"
          # Expand the trusted GitHub run ID and commit on the runner.
          # shellcheck disable=SC2029
          ssh aboutme-production "mkdir -p '$destination'"
          rsync -az --chmod=D755,F644 dist/ "aboutme-production:$destination/"
          # shellcheck disable=SC2029
          ssh aboutme-production "bash -s -- '$RELEASE_ID'" < deploy/release.sh
      - name: Verify public HTTPS
        env:
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          actual=$(curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://aboutme.zimagent.top/deploy-version.txt)
          test "$actual" = "$RELEASE_ID"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/aboutme_deploy ~/.ssh/known_hosts ~/.ssh/config
